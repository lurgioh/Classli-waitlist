<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowState — Study & Planner</title>
    <meta name="description" content="FlowState — Made for students, by students." />

    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at top,
          #1a1a1a,
          #0b0b0b 60%
        );
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        padding: 24px;
        color: white;
      }

      .card {
        width: 100%;
        max-width: 720px;
        border-radius: 20px;
        padding: 28px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      .header {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 18px;
      }

      /* LOGO FIX */
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        overflow: hidden;
        flex-shrink: 0;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.4px;
      }

      p {
        margin: 6px 0 0;
        opacity: 0.85;
        line-height: 1.4;
      }

      form {
        margin-top: 22px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      input {
        flex: 1;
        min-width: 220px;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: white;
        outline: none;
        font-size: 15px;
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      button {
        padding: 14px 20px;
        border-radius: 14px;
        border: none;
        background: #2f6fed;
        color: white;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.05s ease, opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.9;
      }

      button:active {
        transform: scale(0.97);
      }

      .badges {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      .badge {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        opacity: 0.85;
      }

      .fine {
        margin-top: 14px;
        font-size: 12px;
        opacity: 0.6;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="header">
        <div class="logo">
          <img src="FlowState.png" alt="FlowState logo" />
        </div>

        <div>
          <h1>FlowState: Study & Planner</h1>
          <p>
            Made for students, by students. Join the waitlist for early access.
          </p>
        </div>
      </div>

      <!-- Netlify form -->
      <form name="waitlist" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="waitlist" />
        <input
          type="email"
          name="email"
          placeholder="you@school.edu"
          required
        />
        <button type="submit">Join</button>
      </form>

      <div class="badges">
        <span class="badge">iPhone</span>
        <span class="badge">iPad</span>
        <span class="badge">Mac (Apple Silicon)</span>
      </div>

      <p class="fine">
        No spam. Just launch updates and invite waves.
      </p>
    </main>
  </body>
</html>
